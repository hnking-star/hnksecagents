[project]
name = "hnksecagents"
version = "0.1.0"
description = "Local-first refactor of open-ptc-agent for hnksecagents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents==0.3.5",
    "langchain==1.2.3",
    "langgraph==1.0.6",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hnk_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
